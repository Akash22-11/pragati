<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Verification Queue · Web Pragati</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header class="topbar">
    <div class="brand">
      <span class="brand-name">Web Pragati</span>
    </div>

    <nav class="topnav">
      <a href="#" class="nav-link" data-nav="student">Student Dashboard</a>
      <a href="#" class="nav-link active" data-nav="verification">Verification Queue</a>
    </nav>

    <div class="profile">
      <button id="themeToggle" class="theme-toggle" aria-label="Toggle dark mode">🌙</button>
      <span class="profile-name">Prof. Meera Nair</span>
      <span class="avatar">MN</span>
    </div>
  </header>

  <main class="page">

    <!-- ===== PAGE TITLE + STATS ===== -->
    <section class="page-head">
      <div>
        <h1>Verification Queue</h1>
        <p class="subtitle">Faculty &amp; Admin Review Dashboard</p>
      </div>

      <div class="stats" id="statsBar">
        <!-- populated by JS -->
      </div>
    </section>

    <!-- ===== FILTER BARS ===== -->
    <section class="filters">
      <div class="tab-group" id="queueTabs">
        <button class="tab active" data-queue="all">All Queues</button>
        <button class="tab" data-queue="hod">HOD</button>
        <button class="tab" data-queue="mentor">Mentor</button>
        <button class="tab" data-queue="club">Club Co-ord</button>
      </div>

      <div class="tab-group status-group" id="statusTabs">
        <button class="tab active" data-status="all">All</button>
        <button class="tab" data-status="pending">Pending</button>
        <button class="tab" data-status="approved">Approved</button>
        <button class="tab" data-status="rejected">Rejected</button>
        <button class="tab" data-status="sentback">Sent Back</button>
      </div>
    </section>

    <!-- ===== MAIN GRID ===== -->
    <section class="content-grid">

      <!-- LEFT: submission list -->
      <div class="list-panel">
        <div class="list-header">
          <span>Student</span>
          <span>Achievement</span>
          <span>Category</span>
          <span>Queue</span>
          <span>Submitted</span>
          <span>Status</span>
        </div>
        <div class="list-body" id="submissionList">
          <!-- rows injected by JS -->
        </div>
      </div>

      <!-- RIGHT: detail panel -->
      <div class="detail-panel" id="detailPanel">
        <!-- populated by JS -->
      </div>

    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
