name: Security Scan

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 0 * * 1"

jobs:
  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install safety
        run: pip install safety

      - name: Run security scan
        working-directory: backend
        run: safety check -r requirements.txt || true